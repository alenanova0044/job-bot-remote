name: job-bot-alena

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          STORAGE_PATH: data/seen_jobs.json
        run: python3 bot.py

      - name: Save updated state back to repo
        run: |
          git config user.name "job-bot-alena"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen_jobs.json
          git diff --quiet --cached || git commit -m "chore: update seen_jobs.json [skip ci]"
          git push
